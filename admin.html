<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LA Press Speedsoft - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4 max-w-xl mx-auto min-h-screen pb-12">

  <!-- Header -->
  <header class="mb-5 border-b border-slate-800 pb-3 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-black tracking-wider uppercase text-yellow-400">LA PRESS ADMIN</h1>
      <p id="active-room-display" class="text-[11px] text-slate-400">Managing Active Room</p>
    </div>
    <div>
      <a id="view-room-link" href="room.html" target="_blank" class="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg transition">
        👁️ View Room
      </a>
    </div>
  </header>

  <!-- ROOM CONFIGURATION (COLLAPSIBLE WITH GEAR ICON) -->
  <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg mb-5">
    <div onclick="toggleSettings()" class="flex justify-between items-center cursor-pointer select-none">
      <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wide">SETTINGS</h2>
      <button class="text-base text-yellow-400 hover:scale-110 transition p-1" title="Edit Room Settings">⚙️</button>
    </div>

    <div id="settings-content" class="hidden space-y-3 text-xs pt-3 mt-3 border-t border-slate-800">
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Room Name</label>
        <input type="text" id="room-name-input" placeholder="e.g. LA Press Arena - Weekend Cup" 
               class="w-full bg-slate-950 border border-slate-800 text-white px-3 py-2 rounded-lg focus:outline-none focus:border-yellow-400 text-xs" />
      </div>
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">Rounds Per Game</label>
        <input type="number" id="rounds-input" min="1" max="10" value="3" 
               class="w-full bg-slate-950 border border-slate-800 text-white px-3 py-2 rounded-lg focus:outline-none focus:border-yellow-400 text-xs" />
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="saveRoomSettings()" class="flex-1 bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg transition uppercase tracking-wide">
          Save Settings
        </button>
        <button onclick="promptDeleteRoom()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-2 rounded-lg font-bold transition uppercase tracking-wide">
          Delete Room
        </button>
      </div>
    </div>
  </section>

  <!-- STREAM & TRAILER LINK MANAGER -->
  <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg mb-5">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xs font-bold text-yellow-400 uppercase tracking-wide">📡 Stream & Trailer Link Manager</h2>
      <span class="text-[10px] text-slate-400">Zero Storage Impact</span>
    </div>

    <div class="space-y-3 text-xs">
      <div>
        <label class="block text-slate-300 font-semibold mb-1">YouTube Trailer or Livestream URL</label>
        <div class="flex gap-2">
          <input type="text" id="stream-url-input" placeholder="Paste YouTube link (e.g. https://youtu.be/...)" 
                 class="w-full bg-slate-950 border border-slate-800 text-white px-3 py-2 rounded-lg focus:outline-none focus:border-yellow-400 text-xs" />
          <button onclick="saveStreamUrl()" class="bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold px-4 py-2 rounded-lg transition shrink-0 uppercase">
            Update Feed
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- TEAM PROFILES & ROSTERS (GRID STYLE) -->
  <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg mb-5">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wide flex items-center gap-1.5">
        <span class="text-blue-400">🛡️</span> TEAMS & ROSTERS
      </h2>
      <div class="flex items-center gap-2">
        <span class="text-[10px] text-slate-400">Participating Teams</span>
        <button onclick="addNewTeam()" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 text-[11px] font-bold px-2.5 py-1 rounded border border-slate-700">
          + Add Team
        </button>
      </div>
    </div>
    
    <div id="admin-teams-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div class="text-center py-4 text-slate-500 text-xs col-span-2">Loading teams...</div>
    </div>
  </section>

  <!-- MATCH SCORES & PENALTIES -->
  <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg mb-5">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wide">⚔️ Match Scores & Penalties</h2>
      <button onclick="addNewMatch()" class="bg-slate-800 hover:bg-slate-700 text-yellow-400 text-xs font-semibold px-2.5 py-1 rounded border border-slate-700">
        + Add Match
      </button>
    </div>
    <div id="admin-matches-container" class="space-y-4">
      <div class="text-center py-4 text-slate-500 text-xs">Loading matches...</div>
    </div>
  </section>

  <!-- DELETE CONFIRMATION MODAL -->
  <div id="delete-room-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-red-900/50 rounded-2xl w-full max-w-md p-5 shadow-2xl relative space-y-4">
      <button onclick="closeDeleteModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold">✕</button>
      
      <div class="border-b border-slate-800 pb-3 pr-8">
        <h3 class="text-sm font-black text-red-500 uppercase">Confirm Room Deletion</h3>
        <p class="text-[10px] text-slate-400">Are you sure you want to delete this room?</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Enter Admin Password to Confirm</label>
        <input type="password" id="delete-confirm-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" placeholder="Admin password">
      </div>

      <button onclick="confirmDeleteRoom()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg cursor-pointer">
        Permanently Delete Room
      </button>
    </div>
  </div>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCnDxO6WzA9n4XyF_-0QhT3SksKaUV9C7Q",
      authDomain: "lapress-88be8.firebaseapp.com",
      databaseURL: "https://lapress-88be8-default-rtdb.firebaseio.com",
      projectId: "lapress-88be8",
      storageBucket: "lapress-88be8.firebasestorage.app",
      messagingSenderId: "326291990802",
      appId: "1:326291990802:web:7feedfdb956f3371e3ebcb",
      measurementId: "G-S5G8F8ZHXH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    const dbBasePath = roomId ? `rooms/${roomId}` : '';
    const roomRef = ref(db, `${dbBasePath}/room_settings`);
    const teamsRef = ref(db, `${dbBasePath}/team_profiles`);
    const matchesRef = ref(db, `${dbBasePath}/round_matches`);
    const fullRoomRef = ref(db, dbBasePath);

    if (roomId) {
      document.getElementById("view-room-link").href = `room.html?room=${roomId}`;
      document.getElementById("active-room-display").textContent = `Managing Room ID: ${roomId}`;
    }

    let totalRounds = 3;
    let teamsData = [];
    let matchSchedule = [];
    let activeExpandedTeamIdx = null;
    let currentAdminPassword = "";

    onValue(roomRef, (snapshot) => {
      const settings = snapshot.val();
      if (settings) {
        totalRounds = parseInt(settings.roundsPerGame) || 3;
        currentAdminPassword = settings.adminPassword || "";
        
        const roomInput = document.getElementById("room-name-input");
        if (roomInput && document.activeElement !== roomInput) {
          roomInput.value = settings.roomName || "";
        }

        const roundsInput = document.getElementById("rounds-input");
        if (roundsInput && document.activeElement !== roundsInput) {
          roundsInput.value = totalRounds;
        }

        const streamInput = document.getElementById("stream-url-input");
        if (streamInput && document.activeElement !== streamInput) {
          streamInput.value = settings.streamUrl || "";
        }
      }
    });

    onValue(teamsRef, (snapshot) => {
      const data = snapshot.val();
      teamsData = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
      renderAdminTeams();
      renderAdminMatches();
    });

    onValue(matchesRef, (snapshot) => {
      const data = snapshot.val();
      matchSchedule = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
      renderAdminMatches();
    });

    window.toggleSettings = function() {
      const content = document.getElementById("settings-content");
      content.classList.toggle("hidden");
    };

    window.saveRoomSettings = function() {
      const roomName = document.getElementById("room-name-input").value;
      const roundsPerGame = parseInt(document.getElementById("rounds-input").value) || 3;

      update(roomRef, { roomName, roundsPerGame }).then(() => {
        alert("Room settings saved successfully!");
      }).catch(err => alert("Error: " + err.message));
    };

    window.promptDeleteRoom = function() {
      if (!roomId) {
        alert("Cannot delete root/default room structure.");
        return;
      }
      if (confirm(`Are you sure you want to delete Room ID "${roomId}"?`)) {
        document.getElementById("delete-confirm-password").value = "";
        document.getElementById("delete-room-modal").classList.remove("hidden");
      }
    };

    window.closeDeleteModal = function() {
      document.getElementById("delete-room-modal").classList.add("hidden");
    };

    window.confirmDeleteRoom = async function() {
      const enteredPassword = document.getElementById("delete-confirm-password").value;

      if (currentAdminPassword && enteredPassword !== currentAdminPassword) {
        alert("Incorrect password! Deletion canceled.");
        return;
      }

      try {
        await remove(fullRoomRef);
        alert("Room has been successfully deleted.");
        window.location.href = "index.html";
      } catch (error) {
        console.error("Error deleting room:", error);
        alert("Failed to delete room. Please try again.");
      }
    };

    window.saveStreamUrl = function() {
      const url = document.getElementById("stream-url-input").value.trim();
      update(roomRef, { streamUrl: url }).then(() => {
        alert("Stream/Trailer link updated successfully!");
      }).catch(err => alert("Error: " + err.message));
    };

    window.toggleTeamEditor = function(idx) {
      if (activeExpandedTeamIdx === idx) {
        activeExpandedTeamIdx = null;
      } else {
        activeExpandedTeamIdx = idx;
      }
      renderAdminTeams();
    };

    window.addNewTeam = function() {
      teamsData.push({ name: `Team ${String.fromCharCode(65 + teamsData.length)}`, logo: "", players: [] });
      activeExpandedTeamIdx = teamsData.length - 1;
      set(teamsRef, teamsData);
    };

    window.updateTeamName = function(idx, name) {
      teamsData[idx].name = name;
      set(teamsRef, teamsData);
    };

    window.handleTeamLogoUpload = function(idx, event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        teamsData[idx].logo = uploadEvent.target.result;
        set(teamsRef, teamsData).then(() => {
          renderAdminTeams();
        });
      };
      reader.readAsDataURL(file);
    };

    window.deleteTeam = function(idx) {
      if (confirm("Delete this team?")) {
        teamsData.splice(idx, 1);
        if (activeExpandedTeamIdx === idx) activeExpandedTeamIdx = null;
        set(teamsRef, teamsData);
      }
    };

    window.addPlayerToTeam = function(teamIdx) {
      if (!teamsData[teamIdx].players) teamsData[teamIdx].players = [];
      teamsData[teamIdx].players.push({ name: "New Player", photo: "" });
      set(teamsRef, teamsData);
    };

    window.updatePlayerName = function(teamIdx, playerIdx, name) {
      teamsData[teamIdx].players[playerIdx].name = name;
      set(teamsRef, teamsData);
    };

    window.handlePlayerPhotoUpload = function(teamIdx, playerIdx, event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        teamsData[teamIdx].players[playerIdx].photo = uploadEvent.target.result;
        set(teamsRef, teamsData).then(() => {
          renderAdminTeams();
        });
      };
      reader.readAsDataURL(file);
    };

    window.deletePlayer = function(teamIdx, playerIdx) {
      teamsData[teamIdx].players.splice(playerIdx, 1);
      set(teamsRef, teamsData);
    };

    window.addNewMatch = function() {
      matchSchedule.push({
        id: matchSchedule.length + 1,
        teamAIdx: 0,
        teamBIdx: 1,
        teamARounds: new Array(totalRounds).fill(0),
        teamBRounds: new Array(totalRounds).fill(0),
        teamAPenalty: 0,
        teamBPenalty: 0
      });
      set(matchesRef, matchSchedule);
    };

    window.updateMatchField = function(matchIdx, field, value) {
      matchSchedule[matchIdx][field] = value;
      set(matchesRef, matchSchedule);
    };

    window.updateMatchRound = function(matchIdx, teamKey, roundIdx, value) {
      const val = parseInt(value) || 0;
      if (teamKey === 'A') {
        if (!matchSchedule[matchIdx].teamARounds) matchSchedule[matchIdx].teamARounds = new Array(totalRounds).fill(0);
        matchSchedule[matchIdx].teamARounds[roundIdx] = val;
      } else {
        if (!matchSchedule[matchIdx].teamBRounds) matchSchedule[matchIdx].teamBRounds = new Array(totalRounds).fill(0);
        matchSchedule[matchIdx].teamBRounds[roundIdx] = val;
      }
      set(matchesRef, matchSchedule);
    };

    window.deleteMatch = function(matchIdx) {
      if (confirm("Delete this match?")) {
        matchSchedule.splice(matchIdx, 1);
        set(matchesRef, matchSchedule);
      }
    };

    function renderAdminTeams() {
      const container = document.getElementById("admin-teams-container");
      if (!container) return;

      if (!teamsData.length) {
        container.innerHTML = `<div class="text-center py-4 text-slate-500 text-xs col-span-2">No teams added yet. Click "+ Add Team".</div>`;
        return;
      }

      container.innerHTML = "";
      teamsData.forEach((team, tIdx) => {
        const isExpanded = activeExpandedTeamIdx === tIdx;
        const logoImg = team.logo ? `<img src="${team.logo}" class="w-7 h-7 rounded-full object-cover border border-slate-700 shrink-0" />` : `<div class="w-7 h-7 rounded-full bg-blue-500/20 border border-blue-500/40 flex items-center justify-center text-blue-400 text-xs shrink-0">🛡️</div>`;

        let teamCardHtml = `
          <div onclick="toggleTeamEditor(${tIdx})" class="bg-slate-950 hover:bg-slate-900 border ${isExpanded ? 'border-yellow-400/70 ring-1 ring-yellow-400/30' : 'border-slate-800'} p-3 rounded-xl flex items-center justify-between cursor-pointer transition shadow">
            <div class="flex items-center gap-3 overflow-hidden">
              ${logoImg}
              <span class="text-xs font-bold text-white tracking-wide truncate">${team.name || 'Unnamed Team'}</span>
            </div>
            <span class="text-[10px] text-slate-400 shrink-0 ml-2">${isExpanded ? '▲ Close' : '⚙️ Edit'}</span>
          </div>
        `;

        if (isExpanded) {
          let playersHtml = "";
          (team.players || []).forEach((p, pIdx) => {
            const playerPhotoThumb = p.photo ? `<img src="${p.photo}" class="w-7 h-7 rounded object-cover border border-slate-700 shrink-0" />` : `<div class="w-7 h-7 rounded bg-slate-900 border border-slate-700 flex items-center justify-center text-[10px] text-slate-500 shrink-0">📷</div>`;

            playersHtml += `
              <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-lg border border-slate-800 mb-1.5">
                <input type="text" value="${p.name || ''}" onchange="updatePlayerName(${tIdx}, ${pIdx}, this.value)" placeholder="Player Name" class="bg-slate-950 border border-slate-700 text-white px-2 py-1 rounded text-xs flex-1" />
                <div class="flex items-center gap-1.5">
                  ${playerPhotoThumb}
                  <label class="bg-slate-800 hover:bg-slate-700 text-yellow-400 text-[10px] font-semibold px-2 py-1 rounded cursor-pointer border border-slate-700 transition">
                    Upload Photo
                    <input type="file" accept="image/*" onchange="handlePlayerPhotoUpload(${tIdx}, ${pIdx}, event)" class="hidden" />
                  </label>
                </div>
                <button onclick="deletePlayer(${tIdx}, ${pIdx})" class="text-red-400 hover:text-red-300 px-1 text-xs font-bold ml-1">✕</button>
              </div>
            `;
          });

          teamCardHtml += `
            <div class="col-span-1 sm:col-span-2 bg-slate-950 p-4 rounded-xl border border-yellow-400/30 space-y-3 mt-1 shadow-inner">
              <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-xs font-black text-yellow-400 uppercase">Editing: ${team.name}</span>
                <button onclick="deleteTeam(${tIdx})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded text-[11px] font-semibold transition">Delete Team</button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div>
                  <label class="block text-slate-400 mb-1 font-semibold">Team Name</label>
                  <input type="text" value="${team.name || ''}" onchange="updateTeamName(${tIdx}, this.value)" placeholder="Team Name" class="w-full bg-slate-900 border border-slate-700 text-white px-2.5 py-1.5 rounded" />
                </div>
                <div>
                  <label class="block text-slate-400 mb-1 font-semibold">Team Logo Image File</label>
                  <div class="flex items-center gap-2">
                    <label class="w-full bg-slate-900 hover:bg-slate-800 text-yellow-400 border border-slate-700 text-center py-1.5 rounded cursor-pointer text-xs font-semibold transition">
                      📁 Choose Logo Image File
                      <input type="file" accept="image/*" onchange="handleTeamLogoUpload(${tIdx}, event)" class="hidden" />
                    </label>
                  </div>
                </div>
              </div>

              <div class="pt-2">
                <div class="flex justify-between items-center mb-1.5">
                  <span class="text-xs text-slate-300 font-bold uppercase tracking-wider">Roster Players (${(team.players || []).length})</span>
                  <button onclick="addPlayerToTeam(${tIdx})" class="bg-slate-900 hover:bg-slate-800 text-yellow-400 border border-slate-700 px-2.5 py-1 rounded text-[10px] font-bold">+ Add Player</button>
                </div>
                <div class="space-y-1">
                  ${playersHtml || '<div class="text-[11px] text-slate-500 italic py-1">No players added yet.</div>'}
                </div>
              </div>
            </div>
          `;
        }

        container.innerHTML += teamCardHtml;
      });
    }

    function renderAdminMatches() {
      const container = document.getElementById("admin-matches-container");
      if (!container) return;

      if (!matchSchedule.length) {
        container.innerHTML = `<div class="text-center py-4 text-slate-500 text-xs">No matches added yet.</div>`;
        return;
      }

      container.innerHTML = "";
      matchSchedule.forEach((match, mIdx) => {
        let teamOptions = "";
        teamsData.forEach((team, tIdx) => {
          teamOptions += `<option value="${tIdx}" ${match.teamAIdx == tIdx ? 'selected' : ''}>${team.name || 'Team ' + tIdx}</option>`;
        });

        let teamBOptions = "";
        teamsData.forEach((team, tIdx) => {
          teamBOptions += `<option value="${tIdx}" ${match.teamBIdx == tIdx ? 'selected' : ''}>${team.name || 'Team ' + tIdx}</option>`;
        });

        let headerLabels = "";
        for (let r = 0; r < totalRounds; r++) {
          headerLabels += `<span class="w-10 text-center text-[10px] font-bold text-slate-400 uppercase">R${r + 1}</span>`;
        }
        headerLabels += `<span class="w-12 text-center text-[10px] font-bold text-red-400 uppercase">Pen</span>`;

        let roundInputsA = "";
        let roundInputsB = "";

        for (let r = 0; r < totalRounds; r++) {
          const valA = match.teamARounds ? (match.teamARounds[r] || 0) : 0;
          const valB = match.teamBRounds ? (match.teamBRounds[r] || 0) : 0;
          roundInputsA += `<input type="number" value="${valA}" onchange="updateMatchRound(${mIdx}, 'A', ${r}, this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-white px-1 py-1 rounded text-xs" />`;
          roundInputsB += `<input type="number" value="${valB}" onchange="updateMatchRound(${mIdx}, 'B', ${r}, this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-white px-1 py-1 rounded text-xs" />`;
        }

        container.innerHTML += `
          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
              <span class="text-xs font-black text-yellow-400">MATCH #${match.id || (mIdx + 1)}</span>
              <button onclick="deleteMatch(${mIdx})" class="text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 w-7 h-7 rounded-lg border border-red-500/30 flex items-center justify-center transition text-xs" title="Delete Match">🗑️</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">Team A</label>
                <select onchange="updateMatchField(${mIdx}, 'teamAIdx', parseInt(this.value))" class="w-full bg-slate-900 border border-slate-700 text-white p-1.5 rounded text-xs">${teamOptions}</select>
              </div>
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">Team B</label>
                <select onchange="updateMatchField(${mIdx}, 'teamBIdx', parseInt(this.value))" class="w-full bg-slate-900 border border-slate-700 text-white p-1.5 rounded text-xs">${teamBOptions}</select>
              </div>
            </div>

            <div class="flex justify-end pt-1">
              <div class="flex items-center gap-1">
                ${headerLabels}
              </div>
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-slate-300 font-medium">Team A Scores</span>
                <div class="flex items-center gap-1">
                  ${roundInputsA}
                  <input type="number" value="${match.teamAPenalty || 0}" onchange="updateMatchField(${mIdx}, 'teamAPenalty', parseInt(this.value) || 0)" placeholder="Pen" class="w-12 bg-slate-900 border border-red-500/40 text-center text-red-400 px-1 py-1 rounded text-xs" title="Penalty" />
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px]">
                <span class="text-slate-300 font-medium">Team B Scores</span>
                <div class="flex items-center gap-1">
                  ${roundInputsB}
                  <input type="number" value="${match.teamBPenalty || 0}" onchange="updateMatchField(${mIdx}, 'teamBPenalty', parseInt(this.value) || 0)" placeholder="Pen" class="w-12 bg-slate-900 border border-red-500/40 text-center text-red-400 px-1 py-1 rounded text-xs" title="Penalty" />
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
