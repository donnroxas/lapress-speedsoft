<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Admin Panel</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0f172a',
              950: '#020617'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- HEADER -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-lg font-black text-yellow-400 tracking-wider uppercase">⚡ Tournament Admin Panel</h1>
        <p class="text-xs text-slate-400">Manage brackets, match scores, penalties, and teams in real time.</p>
      </div>
      <div id="connection-status" class="text-[10px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-slate-400">
        Connecting...
      </div>
    </header>

    <!-- TEAMS CONFIGURATION SECTION -->
    <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wide">🛡️ Participating Teams</h2>
        <button onclick="addNewTeam()" class="bg-slate-800 hover:bg-slate-700 text-slate-100 text-[10px] font-bold px-2.5 py-1.5 rounded transition">
          + Add Team
        </button>
      </div>
      <div id="admin-teams-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div class="text-center py-3 text-slate-500 text-xs col-span-full">Loading teams...</div>
      </div>
    </section>

    <!-- MATCH SCORES & BRACKETS SECTION -->
    <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 shadow-lg">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold text-slate-100 uppercase tracking-wide">⚔️ Brackets & Match Scores</h2>
        <button onclick="addNewBracket()" class="bg-yellow-400 hover:bg-yellow-300 text-slate-900 text-[10px] font-bold px-2.5 py-1.5 rounded transition">
          + New Bracket
        </button>
      </div>
      <div id="admin-brackets-container" class="space-y-6">
        <div class="text-center py-4 text-slate-500 text-xs">Loading brackets...</div>
      </div>
    </section>

  </div>

  <!-- Firebase SDKs & Script Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCnDxO6WzA9n4XyF_-0QhT3SksKaUV9C7Q",
      authDomain: "lapress-88be8.firebaseapp.com",
      databaseURL: "https://lapress-88be8-default-rtdb.firebaseio.com",
      projectId: "lapress-88be8",
      storageBucket: "lapress-88be8.firebasestorage.app",
      messagingSenderId: "326291990802",
      appId: "1:326291990802:web:7feedfdb956f3371e3ebcb",
      measurementId: "G-S5G8F8ZHXH"
    };

    const statusEl = document.getElementById("connection-status");

    try {
      // Initialize Firebase & Analytics
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getDatabase(app);
      
      const dbBasePath = "tournament/main";

      window.db = db;
      window.dbBasePath = dbBasePath;
      window.teamsList = [];
      let bracketsData = {};
      let totalRounds = 3;

      const teamsRef = ref(db, `${dbBasePath}/teams`);
      const bracketsRef = ref(db, `${dbBasePath}/brackets`);

      // Monitor connection state
      const connectedRef = ref(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          statusEl.textContent = "Connected";
          statusEl.className = "text-[10px] bg-emerald-950/50 border border-emerald-900 px-2.5 py-1 rounded-full text-emerald-400";
        } else {
          statusEl.textContent = "Connecting...";
          statusEl.className = "text-[10px] bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-slate-400";
        }
      });

      // Teams Listener
      onValue(teamsRef, (snapshot) => {
        window.teamsList = snapshot.val() || ["Team Alpha", "Team Bravo"];
        renderAdminTeams();
        renderAdminBrackets();
      }, (error) => {
        console.error("Teams read error:", error);
      });

      // Brackets Listener
      onValue(bracketsRef, (snapshot) => {
        bracketsData = snapshot.val() || {};
        renderAdminBrackets();
      }, (error) => {
        console.error("Brackets read error:", error);
      });

      // --- TEAM ACTIONS ---
      window.addNewTeam = function() {
        window.teamsList.push(`Team ${window.teamsList.length + 1}`);
        set(teamsRef, window.teamsList);
      };

      window.updateTeamName = function(idx, value) {
        window.teamsList[idx] = value;
        set(teamsRef, window.teamsList);
      };

      window.deleteTeam = function(idx) {
        if (window.teamsList.length <= 1) {
          alert("You must keep at least one team.");
          return;
        }
        window.teamsList.splice(idx, 1);
        set(teamsRef, window.teamsList);
      };

      // --- BRACKET & MATCH ACTIONS ---
      window.addNewBracket = function() {
        const bracketId = "Bracket_" + Date.now();
        bracketsData[bracketId] = [];
        set(bracketsRef, bracketsData);
      };

      window.deleteBracket = function(bracketId) {
        if (confirm(`Are you sure you want to delete ${bracketId.replace('_', ' ')}?`)) {
          delete bracketsData[bracketId];
          set(bracketsRef, bracketsData);
        }
      };

      window.addNewMatchToBracket = function(bracketId) {
        if (!bracketsData[bracketId]) bracketsData[bracketId] = [];
        bracketsData[bracketId].push({
          id: Date.now(),
          teamAIdx: 0,
          teamBIdx: window.teamsList.length > 1 ? 1 : 0,
          teamARounds: new Array(totalRounds).fill(0),
          teamBRounds: new Array(totalRounds).fill(0),
          teamAPenalty: 0,
          teamBPenalty: 0
        });
        set(bracketsRef, bracketsData);
      };

      window.deleteMatchFromBracket = function(bracketId, matchIdx) {
        bracketsData[bracketId].splice(matchIdx, 1);
        set(bracketsRef, bracketsData);
      };

      window.updateMatchRound = function(bracketId, matchIdx, teamKey, roundIdx, value) {
        const val = parseInt(value) || 0;
        if (teamKey === 'A') {
          bracketsData[bracketId][matchIdx].teamARounds[roundIdx] = val;
        } else {
          bracketsData[bracketId][matchIdx].teamBRounds[roundIdx] = val;
        }
        set(bracketsRef, bracketsData);
      };

      window.updateMatchPenalty = function(bracketId, matchIdx, teamKey, value) {
        const val = parseInt(value) || 0;
        if (teamKey === 'A') {
          bracketsData[bracketId][matchIdx].teamAPenalty = val;
        } else {
          bracketsData[bracketId][matchIdx].teamBPenalty = val;
        }
        set(bracketsRef, bracketsData);
      };

      window.updateMatchTeam = function(bracketId, matchIdx, teamKey, value) {
        const val = parseInt(value) || 0;
        if (teamKey === 'A') {
          bracketsData[bracketId][matchIdx].teamAIdx = val;
        } else {
          bracketsData[bracketId][matchIdx].teamBIdx = val;
        }
        set(bracketsRef, bracketsData);
      };

      // --- RENDERING FUNCTIONS ---
      function renderAdminTeams() {
        const container = document.getElementById("admin-teams-container");
        if (!container) return;
        container.innerHTML = window.teamsList.map((team, idx) => `
          <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="text-[10px] text-slate-500 font-bold w-5 text-center">#${idx + 1}</span>
            <input type="text" value="${typeof team === 'object' ? team.name : team}" 
              onchange="updateTeamName(${idx}, this.value)" 
              class="bg-slate-900 border border-slate-700 text-xs rounded px-2 py-1 text-white flex-1 focus:outline-none focus:border-yellow-400">
            <button onclick="deleteTeam(${idx})" class="text-red-400 hover:text-red-300 text-[10px] px-1.5 py-1">✕</button>
          </div>
        `).join('');
      }

      function renderAdminBrackets() {
        const container = document.getElementById("admin-brackets-container");
        if (!container) return;

        const bracketKeys = Object.keys(bracketsData);
        if (bracketKeys.length === 0) {
          container.innerHTML = `
            <div class="text-center py-6 text-slate-500 text-xs bg-slate-950 rounded-lg border border-dashed border-slate-800">
              No brackets created yet. Click "+ New Bracket" above to start.
            </div>
          `;
          return;
        }

        container.innerHTML = "";
        bracketKeys.forEach((bId) => {
          const matches = bracketsData[bId] || [];
          let matchesHtml = "";
          
          if (matches.length === 0) {
            matchesHtml = `<div class="text-center py-3 text-slate-500 text-xs">No matches in this bracket yet.</div>`;
          } else {
            matchesHtml = matches.map((m, mIdx) => {
              let roundInputsA = "";
              let roundInputsB = "";
              for (let r = 0; r < totalRounds; r++) {
                const scoreA = m.teamARounds?.[r] || 0;
                const scoreB = m.teamBRounds?.[r] || 0;
                roundInputsA += `<input type="number" value="${scoreA}" onchange="updateMatchRound('${bId}', ${mIdx}, 'A', ${r}, this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-xs rounded py-1 text-white">`;
                roundInputsB += `<input type="number" value="${scoreB}" onchange="updateMatchRound('${bId}', ${mIdx}, 'B', ${r}, this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-xs rounded py-1 text-white">`;
              }

              const optionsA = window.teamsList.map((t, idx) => `<option value="${idx}" ${m.teamAIdx === idx ? 'selected' : ''}>${t.name || t}</option>`).join('');
              const optionsB = window.teamsList.map((t, idx) => `<option value="${idx}" ${m.teamBIdx === idx ? 'selected' : ''}>${t.name || t}</option>`).join('');

              return `
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-2">
                  <div class="flex justify-between items-center text-[11px] text-slate-400 border-b border-slate-800 pb-1.5">
                    <span class="font-bold text-slate-300">Match #${mIdx + 1}</span>
                    <button onclick="deleteMatchFromBracket('${bId}', ${mIdx})" class="text-red-400 hover:text-red-300 text-[10px]">Remove Match</button>
                  </div>
                  <div class="flex items-center gap-2 justify-between flex-wrap sm:flex-nowrap">
                    <select onchange="updateMatchTeam('${bId}', ${mIdx}, 'A', this.value)" class="bg-slate-950 border border-slate-700 text-xs rounded px-2 py-1 text-white flex-1 min-w-[120px]">${optionsA}</select>
                    <div class="flex gap-1">${roundInputsA}</div>
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] text-red-400 font-medium">Pen:</span>
                      <input type="number" value="${m.teamAPenalty || 0}" onchange="updateMatchPenalty('${bId}', ${mIdx}, 'A', this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-xs rounded py-1 text-white">
                    </div>
                  </div>
                  <div class="flex items-center gap-2 justify-between flex-wrap sm:flex-nowrap">
                    <select onchange="updateMatchTeam('${bId}', ${mIdx}, 'B', this.value)" class="bg-slate-950 border border-slate-700 text-xs rounded px-2 py-1 text-white flex-1 min-w-[120px]">${optionsB}</select>
                    <div class="flex gap-1">${roundInputsB}</div>
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] text-red-400 font-medium">Pen:</span>
                      <input type="number" value="${m.teamBPenalty || 0}" onchange="updateMatchPenalty('${bId}', ${mIdx}, 'B', this.value)" class="w-10 bg-slate-900 border border-slate-700 text-center text-xs rounded py-1 text-white">
                    </div>
                  </div>
                </div>
              `;
            }).join('');
          }

          container.innerHTML += `
            <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 shadow-inner">
              <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <span class="text-xs font-bold text-yellow-400 uppercase tracking-wider">${bId.replace('_', ' ')}</span>
                <div class="flex gap-2">
                  <button onclick="addNewMatchToBracket('${bId}')" class="text-[10px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-white transition">+ Add Match</button>
                  <button onclick="deleteBracket('${bId}')" class="text-[10px] bg-red-950 hover:bg-red-900/50 border border-red-900/50 px-2 py-1 rounded text-red-400 transition">Delete Bracket</button>
                </div>
              </div>
              <div class="space-y-3">${matchesHtml}</div>
            </div>
          `;
        });
      }

    } catch (err) {
      console.error("Firebase Initialization Error:", err);
      statusEl.textContent = "Init Error";
      statusEl.className = "text-[10px] bg-red-950/50 border border-red-900 px-2.5 py-1 rounded-full text-red-400";
    }
  </script>
</body>
</html>
