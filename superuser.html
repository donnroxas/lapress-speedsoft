<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LA Press Speedsoft - SuperUser Control Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Force date picker icon to be visible and white/yellow on dark background */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(1.5);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white p-4 max-w-2xl mx-auto min-h-screen pb-16 relative font-sans">

  <!-- AUTHENTICATION CONTAINER -->
  <div id="auth-container" class="mt-20 bg-[#111827] border border-slate-800 rounded-2xl p-6 shadow-2xl max-w-sm mx-auto text-center">
    <div class="text-3xl mb-2">⚡</div>
    <h1 class="text-base font-black uppercase text-yellow-400 tracking-wider mb-1">SuperUser Authentication</h1>
    <p class="text-xs text-slate-400 mb-4">Sign in with your registered Firebase admin credentials.</p>
    
    <input type="email" id="email-input" placeholder="Admin Email" 
           class="w-full bg-[#0b0f19] border border-slate-800 text-white text-xs px-3 py-2.5 rounded-xl mb-2.5 text-center focus:outline-none focus:border-yellow-400 transition" />
    
    <input type="password" id="password-input" placeholder="Password" 
           class="w-full bg-[#0b0f19] border border-slate-800 text-white text-xs px-3 py-2.5 rounded-xl mb-3 text-center focus:outline-none focus:border-yellow-400 transition" />
    
    <button id="auth-btn" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs py-2.5 rounded-xl transition shadow-lg shadow-yellow-400/10 cursor-pointer uppercase tracking-wide">
      Authenticate
    </button>
    <p id="auth-error" class="text-red-400 text-[11px] mt-2 hidden">Invalid credentials or unauthorized user.</p>
  </div>

  <!-- DASHBOARD CONTAINER (HIDDEN UNTIL AUTHENTICATED) -->
  <div id="dashboard-container" class="hidden">
    <!-- Header -->
    <header class="mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-black tracking-wide uppercase text-yellow-400">⚡ SUPERUSER DASHBOARD</h1>
        <p class="text-xs text-slate-400 mt-0.5">Root Management & Multi-Room Control</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openCreateModal()" class="bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs px-4 py-2.5 rounded-xl transition shadow-lg shadow-yellow-400/10 cursor-pointer">
          + Create Room
        </button>
        <button id="logout-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2.5 rounded-xl border border-slate-700 cursor-pointer transition">
          Lock
        </button>
      </div>
    </header>

    <!-- SEARCH & FILTER BAR -->
    <div class="flex gap-2 mb-6">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input type="text" id="search-input" oninput="filterRooms()" placeholder="Search room or host..." class="w-full bg-[#111827] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-slate-700 transition" />
      </div>
      <select id="status-filter" onchange="filterRooms()" class="bg-[#111827] border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-slate-700 transition cursor-pointer">
        <option value="all">All Status</option>
        <option value="live">Live Now</option>
      </select>
    </div>

    <!-- ROOMS LIST CONTAINER -->
    <section id="rooms-container" class="space-y-4">
      <div class="text-center py-10 text-slate-500 text-xs bg-[#111827]/50 rounded-2xl border border-slate-800/80">
        Loading tournament rooms...
      </div>
    </section>
  </div>

  <!-- CREATE ROOM MODAL -->
  <div id="create-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 shadow-2xl relative space-y-4">
      <button onclick="closeCreateModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold cursor-pointer">✕</button>
      
      <div class="border-b border-slate-800 pb-3 pr-8">
        <h3 class="text-sm font-black text-yellow-400 uppercase tracking-wide">Create Tournament Room</h3>
        <p class="text-[10px] text-slate-400">Set up a new live scoreboard room</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Room Name</label>
          <input type="text" id="new-room-name" placeholder="e.g. LA Press Winter Cup" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-400" />
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tournament Date</label>
          <input type="date" id="new-room-date" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-400 cursor-pointer" />
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Admin Password</label>
          <input type="password" id="new-room-pass" placeholder="Password to edit matches" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-400" />
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Confirm Password</label>
          <input type="password" id="new-room-pass-confirm" placeholder="Re-enter password" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-400" />
        </div>
      </div>

      <div class="pt-2">
        <button onclick="createNewRoom()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs py-2.5 rounded-xl transition shadow-lg shadow-yellow-400/10 cursor-pointer">
          Create Room & Enter Dashboard 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- FIREBASE & SUPERUSER PORTAL LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCnDxO6WzA9n4XyF_-0QhT3SksKaUV9C7Q",
      authDomain: "lapress-88be8.firebaseapp.com",
      databaseURL: "https://lapress-88be8-default-rtdb.firebaseio.com",
      projectId: "lapress-88be8",
      storageBucket: "lapress-88be8.firebasestorage.app",
      messagingSenderId: "326291990802",
      appId: "1:326291990802:web:7feedfdb956f3371e3ebcb",
      measurementId: "G-S5G8F8ZHXH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let allRoomsCache = [];
    let countdownInterval = null;

    function loginSuperUser() {
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      const errorEl = document.getElementById("auth-error");

      if (!email || !password) {
        errorEl.textContent = "Please fill in both fields.";
        errorEl.classList.remove("hidden");
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          errorEl.classList.add("hidden");
          showDashboard();
        })
        .catch((error) => {
          errorEl.textContent = error.message;
          errorEl.classList.remove("hidden");
        });
    }

    function logoutSuperUser() {
      signOut(auth).then(() => {
        location.reload();
      }).catch((error) => {
        console.error("Sign out error", error);
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showDashboard();
      } else {
        showAuthScreen();
      }
    });

    function showDashboard() {
      document.getElementById("auth-container").classList.add("hidden");
      document.getElementById("dashboard-container").classList.remove("hidden");
      loadRoomsPortal();
    }

    function showAuthScreen() {
      document.getElementById("auth-container").classList.remove("hidden");
      document.getElementById("dashboard-container").classList.add("hidden");
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    async function loadRoomsPortal() {
      const container = document.getElementById("rooms-container");
      
      try {
        const rootRef = ref(db);
        const snapshot = await get(rootRef);
        
        if (!snapshot.exists()) {
          container.innerHTML = `
            <div class="text-center py-10 bg-[#111827] rounded-2xl border border-slate-800 p-6 space-y-3">
              <p class="text-xs text-slate-400">No active tournament rooms found.</p>
              <button onclick="openCreateModal()" class="px-4 py-2 bg-yellow-400 text-slate-950 font-black text-xs rounded-xl cursor-pointer">Create First Room</button>
            </div>`;
          return;
        }

        const rootData = snapshot.val();
        allRoomsCache = [];

        Object.keys(rootData).forEach(rId => {
          const roomObj = rootData[rId];
          
          if (roomObj && typeof roomObj === 'object') {
            const settings = roomObj.room_settings || {};
            const roomName = settings.roomName || roomObj.roomName || roomObj.title || rId.replace(/-/g, ' ').toUpperCase();
            const streamUrl = settings.streamUrl || roomObj.streamUrl || "";
            const teamsMap = roomObj.team_profiles || {};
            const teamCount = Object.keys(teamsMap).length;
            const isLiveNow = streamUrl && streamUrl.trim() !== "";
            const rawDate = settings.roomDate || roomObj.roomDate || new Date().toISOString().split('T')[0];
            const adminPassword = settings.adminPassword || settings.password || roomObj.adminPassword || roomObj.password || "N/A";

            let displayDate = rawDate;
            try {
              const [y, m, d] = rawDate.split('-').map(Number);
              displayDate = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch (e) {
              displayDate = rawDate;
            }

            allRoomsCache.push({
              id: rId,
              name: roomName,
              path: rId,
              streamUrl,
              teamCount,
              isLiveNow,
              rawDate,
              displayDate,
              adminPassword
            });
          }
        });

        renderRoomsList(allRoomsCache);
        
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateCountdowns, 1000);

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="text-center py-6 text-red-400 text-xs">Error loading rooms from database.</div>`;
      }
    }

    window.renderRoomsList = function(rooms) {
      const container = document.getElementById("rooms-container");
      if (!rooms.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs bg-[#111827] rounded-2xl border border-slate-800">No rooms match your filter.</div>`;
        return;
      }

      container.innerHTML = "";

      rooms.forEach(room => {
        const liveBadgeHtml = room.isLiveNow ? 
          `<span class="flex items-center gap-1.5 text-[10px] text-emerald-400 font-bold uppercase tracking-wider bg-emerald-500/10 border border-emerald-500/30 px-3 py-1 rounded-full"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>LIVE NOW</span>` : 
          ``;

        container.innerHTML += `
          <div class="bg-[#111827] border border-slate-800 hover:border-slate-700 rounded-2xl p-4 transition space-y-4 shadow-xl">
            <div class="flex justify-between items-start gap-3">
              <div>
                <h3 class="text-sm font-black text-white uppercase tracking-wide">${escapeHtml(room.name)}</h3>
                <span class="text-[9px] text-slate-500 uppercase">ID: ${room.id}</span>
              </div>
              <div class="flex items-center gap-2">
                ${liveBadgeHtml}
                <button onclick="deleteRoom('${room.path}', '${escapeHtml(room.name)}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 w-7 h-7 rounded-xl flex items-center justify-center text-xs transition cursor-pointer" title="Delete Room">
                  🗑️
                </button>
              </div>
            </div>

            <!-- Date & Timer Section -->
            <div class="flex flex-col sm:flex-row items-center justify-between bg-[#0b0f19] border border-slate-800/80 rounded-xl p-3.5 gap-3">
              <div class="flex items-center gap-2 text-xs text-slate-300 font-bold shrink-0">
                <span>📅</span>
                <span>${room.displayDate}</span>
              </div>

              <div class="flex items-center gap-1.5 justify-center shrink-0" id="countdown-${room.id}" data-date="${room.rawDate}">
                <!-- Rendered dynamically -->
              </div>
            </div>

            <!-- Meta Details & Admin Password Badge -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-3 px-1 gap-2">
              <div class="flex items-center gap-2">
                <span>🛡️</span>
                <span>${room.teamCount} Team${room.teamCount === 1 ? '' : 's'}</span>
              </div>
              <div>
                <span class="text-[11px] text-yellow-400 bg-yellow-400/10 border border-yellow-400/20 px-2.5 py-1 rounded-lg font-mono">🔑 Pass: ${escapeHtml(room.adminPassword)}</span>
              </div>
            </div>

            <div>
              <button onclick="handleRoomAccess('${room.id}')" class="w-full bg-[#0b0f19] hover:bg-slate-900 border border-slate-800 text-yellow-400 hover:text-yellow-300 text-center font-black text-xs py-3 rounded-xl transition cursor-pointer shadow-inner flex items-center justify-center gap-2">
                Enter Room ➔
              </button>
            </div>
          </div>
        `;
      });

      updateCountdowns();
    };

    function updateCountdowns() {
      const now = new Date();
      const currentDateOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      document.querySelectorAll('[id^="countdown-"]').forEach(el => {
        const rawDate = el.getAttribute('data-date');
        if (!rawDate) return;
        
        const parts = rawDate.split('-').map(Number);
        if (parts.length < 3) return;
        const [y, m, d] = parts;
        const targetDateOnly = new Date(y, m - 1, d).getTime();

        if (targetDateOnly < currentDateOnly) {
          el.innerHTML = `
            <div class="bg-slate-800/60 border border-slate-700 text-slate-400 text-sm font-black uppercase px-5 py-2 rounded-lg tracking-wider">
              Finished
            </div>
          `;
          return;
        }

        if (targetDateOnly === currentDateOnly) {
          el.innerHTML = `
            <div class="bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 text-sm font-black uppercase px-5 py-2 rounded-lg tracking-wider animate-pulse">
              Happening Today
            </div>
          `;
          return;
        }

        const targetDateTime = new Date(y, m - 1, d, 0, 0, 0).getTime();
        const diff = targetDateTime - now.getTime();

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const pad = (n) => String(n).padStart(2, '0');

        const createFlipUnit = (value, label) => `
          <div class="flex flex-col items-center">
            <div class="bg-[#141d2f] border border-slate-700/80 rounded-lg px-3 py-1.5 text-lg font-mono font-black text-yellow-400 shadow-md">
              ${pad(value)}
            </div>
            <span class="text-[10px] text-slate-400 uppercase mt-1 font-bold">${label}</span>
          </div>
        `;

        let html = '';
        if (days > 0) {
          html += createFlipUnit(days, 'Days');
          html += `<span class="text-slate-600 font-black text-lg pb-5">:</span>`;
        }
        html += createFlipUnit(hours, 'Hrs');
        html += `<span class="text-slate-600 font-black text-lg pb-5">:</span>`;
        html += createFlipUnit(minutes, 'Min');
        html += `<span class="text-slate-600 font-black text-lg pb-5">:</span>`;
        html += createFlipUnit(seconds, 'Sec');

        el.innerHTML = html;
      });
    }

    window.filterRooms = function() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const status = document.getElementById("status-filter").value;

      const filtered = allRoomsCache.filter(room => {
        const matchesQuery = room.name.toLowerCase().includes(query) || room.id.toLowerCase().includes(query);
        const matchesStatus = status === 'all' || (status === 'live' && room.isLiveNow);
        return matchesQuery && matchesStatus;
      });

      renderRoomsList(filtered);
    };

    window.openCreateModal = function() {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById("new-room-date");
      if (dateInput && !dateInput.value) {
        dateInput.value = today;
      }
      document.getElementById("create-modal").classList.remove("hidden");
    };

    window.closeCreateModal = function() {
      document.getElementById("create-modal").classList.add("hidden");
    };

    window.createNewRoom = async function() {
      const nameInput = document.getElementById("new-room-name").value.trim();
      const dateInput = document.getElementById("new-room-date").value;
      const passInput = document.getElementById("new-room-pass").value;
      const passConfirmInput = document.getElementById("new-room-pass-confirm").value;

      if (!nameInput) {
        alert("Please enter a room name.");
        return;
      }

      if (!dateInput) {
        alert("Please select a tournament date.");
        return;
      }

      if (!passInput) {
        alert("Please enter an admin password.");
        return;
      }

      if (passInput !== passConfirmInput) {
        alert("Passwords do not match. Please check and try again.");
        return;
      }

      const roomId = nameInput.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');

      try {
        const roomSettingsRef = ref(db, `${roomId}/room_settings`);
        const snapshot = await get(roomSettingsRef);

        if (!snapshot.exists()) {
          await set(roomSettingsRef, {
            roomName: nameInput,
            roomDate: dateInput,
            adminPassword: passInput,
            roundsPerGame: 3,
            streamUrl: ""
          });
        }

        localStorage.setItem(`admin_${roomId}`, 'true');
        window.location.href = `admin.html?room=${roomId}`;
      } catch (err) {
        console.error(err);
        alert("Failed to create room.");
      }
    };

    window.handleRoomAccess = function(rId) {
      window.location.href = `room.html?room=${rId}`;
    };

    window.deleteRoom = function(path, roomName) {
      const confirmDelete = confirm(`⚠️ ARE YOU SURE?\n\nThis will permanently delete "${roomName}" along with all its settings, teams, and match scores!`);
      if (!confirmDelete) return;

      remove(ref(db, path)).then(() => {
        alert(`Room "${roomName}" has been deleted.`);
        loadRoomsPortal();
      }).catch(err => {
        console.error(err);
        alert("Failed to delete room.");
      });
    };

    document.getElementById("auth-btn").addEventListener("click", loginSuperUser);
    document.getElementById("password-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") loginSuperUser();
    });
    document.getElementById("logout-btn").addEventListener("click", logoutSuperUser);
  </script>
</body>
</html>
